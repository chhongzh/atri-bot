# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: desktop
    # 桌面端御三家：Windows / macOS / Linux
    main: ./cmd/atri-bot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      # go build -x：在 CI 日志中显示编译进度



  - id: android-arm64
    # Android arm64 不需要 CGO，可直接交叉编译。
    main: ./cmd/atri-bot
    env:
      - CGO_ENABLED=0
    goos:
      - android
    goarch:
      - arm64
    # go build -x：在 CI 日志中显示编译进度



  - id: android-amd64
    # Go 对 android/amd64 要求外部链接，使用 NDK clang。
    main: ./cmd/atri-bot
    env:
      - CGO_ENABLED=1
      - CC={{ .Env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
    goos:
      - android
    goarch:
      - amd64
    # go build -x：在 CI 日志中显示编译进度



archives:
  - id: desktop
    ids: [ desktop ]
    formats: [ tar.gz ]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [ zip ]

  - id: android
    ids: [ android-arm64, android-amd64 ]
    # Android 不打压缩包，直接发布可执行文件
    formats: [ binary ]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

dockers:
  - id: linux-amd64
    ids: [ desktop ]
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/chhongzh/atri-bot:{{ .Tag }}-amd64"
    use: buildx
    build_flag_templates:
      - "--build-arg=TZ={{ .Env.TZ }}"

  - id: linux-arm64
    ids: [ desktop ]
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/chhongzh/atri-bot:{{ .Tag }}-arm64"
    use: buildx
    build_flag_templates:
      - "--build-arg=TZ={{ .Env.TZ }}"

docker_manifests:
  - id: linux
    name_template: "ghcr.io/chhongzh/atri-bot:{{ .Tag }}"
    image_templates:
      - "ghcr.io/chhongzh/atri-bot:{{ .Tag }}-amd64"
      - "ghcr.io/chhongzh/atri-bot:{{ .Tag }}-arm64"

  - id: linux-latest
    name_template: "ghcr.io/chhongzh/atri-bot:latest"
    image_templates:
      - "ghcr.io/chhongzh/atri-bot:{{ .Tag }}-amd64"
      - "ghcr.io/chhongzh/atri-bot:{{ .Tag }}-arm64"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-
    Made with Love!
