name: build-binaries

on:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x"]
        target:
          - android-386
          - android-amd64
          - android-arm
          - android-arm64
          - darwin-amd64
          - darwin-arm64
          - linux-386
          - linux-amd64
          - linux-arm
          - linux-arm64
          - windows-386
          - windows-amd64
          - windows-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          GOOS=${TARGET%%-*}
          GOARCH=${TARGET#*-}
          export GOOS GOARCH
          mkdir -p dist
          BIN_NAME="atri-bot-${TARGET}"
          if [ "${GOOS}" = "windows" ]; then
            BIN_NAME="${BIN_NAME}.exe"
          fi
          

          if [ "${GOOS}" = "android" ]; then
            export CGO_ENABLED=1
            
            sudo apt-get update && sudo apt-get install -y wget unzip
            
            NDK_VERSION="r26c"
            NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
            echo "Downloading NDK ${NDK_VERSION}..."
            wget -q $NDK_URL -O ndk.zip
            unzip -q ndk.zip
            NDK_HOME=$(pwd)/android-ndk-${NDK_VERSION}
            TOOLCHAIN_BIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"

            case "${GOARCH}" in
              arm)
                export CC="${TOOLCHAIN_BIN}/armv7a-linux-androideabi21-clang"
                ;;
              arm64)
                export CC="${TOOLCHAIN_BIN}/aarch64-linux-android21-clang"
                ;;
              386)
                export CC="${TOOLCHAIN_BIN}/i686-linux-android21-clang"
                ;;
              amd64)
                export CC="${TOOLCHAIN_BIN}/x86_64-linux-android21-clang"
                ;;
              *)
                echo "Unsupported Android architecture: ${GOARCH}"
                exit 1
                ;;
            esac
            echo "Using Android CC: ${CC}"
          fi


          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X main.BuildVersion=${REF_NAME} -X main.BuildCommit=${COMMIT_SHA} -X main.BuildDate=${BUILD_DATE}"
          echo "GOOS=${GOOS} GOARCH=${GOARCH} VERSION=${REF_NAME} COMMIT=${COMMIT_SHA} DATE=${BUILD_DATE}"
          go build -v -ldflags="$LDFLAGS" -o "dist/${BIN_NAME}" ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atri-bot-${{ matrix.target }}
          path: dist/atri-bot-${{ matrix.target }}*
          if-no-files-found: error

  release:
    permissions: write-all
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          set -e
          COMMITS=$(git log --format=%s)
          FILTERED=$(printf '%s\n' "$COMMITS" | grep -E '^(feat|fix|chore):' || true)
          if [ -z "$FILTERED" ]; then
            BODY="No feat/fix/chore commits"
          else
            BODY=$(printf '%s\n' "$FILTERED")
          fi
          {
            printf 'release_body<<EOF\n'
            printf '%s\n' "$BODY"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.release_body }}
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
