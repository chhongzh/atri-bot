name: build-binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x"]
        os: [linux, windows, darwin]
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p dist
          BIN_NAME="atri-bot-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BIN_NAME="${BIN_NAME}.exe"
          fi
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X atri-bot.BuildVersion=${REF_NAME} -X atri-bot.BuildCommit=${COMMIT_SHA} -X atri-bot.BuildDate=${BUILD_DATE}"
          echo "GOOS=${GOOS} GOARCH=${GOARCH} VERSION=${REF_NAME} COMMIT=${COMMIT_SHA} DATE=${BUILD_DATE}"
          go build -v -ldflags="$LDFLAGS" -o "dist/${BIN_NAME}" ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atri-bot-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/atri-bot-${{ matrix.os }}-${{ matrix.arch }}*
          if-no-files-found: error
