# golangci-lint v2 配置
#
# 注释类检查全部关闭（revive/godot/godoclint），不强制要求为导出符号写注释。
version: "2"

run:
  timeout: 5m
  concurrency: 4

formatters:
  enable:
    - gofmt

linters:
  default: standard
  enable:
    - bodyclose
    - durationcheck
    - errname
    - gocritic
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign
  disable:
    - revive
    - godot
    - godoclint
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gocritic
          - noctx
          - wastedassign
